spring:
  application:
    name: server
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_server_db
    username: postgres
    password: 200604
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo}
  api-key: ${CLOUDINARY_API_KEY:demo}
  api-secret: ${CLOUDINARY_API_SECRET:demo}
  upload-preset: ${CLOUDINARY_UPLOAD_PRESET:}

server:
  port: 8080
  servlet:
    context-path: /api
  openapi:
    dev-url: http://localhost:8080
    prod-url: https://your-production-url.com

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    com.portfolio.server: DEBUG
