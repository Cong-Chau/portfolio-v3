spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

server:
  port: ${PORT:8080}
  openapi:
    dev-url: ${OPENAPI_DEV_URL:http://localhost:8080}
    prod-url: ${OPENAPI_PROD_URL:}

logging:
  level:
    org.flywaydb: INFO
    org.springframework.boot.autoconfigure.flyway: INFO
    com.portfolio.server: INFO
    root: INFO
