services:
  # ============================================================================
  # Backend: Java 21 Spring Boot
  # ============================================================================
  - type: web
    name: portfolio-server
    runtime: docker
    rootDir: server
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore # Chọn Singapore để mạng về Việt Nam nhanh nhất
    healthCheckPath: /api/v1/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        sync: false # Điền trên dashboard Render
      - key: DB_PORT
        sync: false # Hỗ trợ port custom như Aiven 22475
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite

