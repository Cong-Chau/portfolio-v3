services:
  # ============================================================================
  # 1. Backend: Java 21 Spring Boot
  # ============================================================================
  - type: web
    name: portfolio-server
    runtime: docker
    rootDir: server
    plan: free
    region: singapore # Chọn Singapore để mạng về Việt Nam nhanh nhất
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: DB_SSLMODE
        value: require
      - key: DB_HOST
        sync: false # Điền trên dashboard Render
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

  # ============================================================================
  # 2. Frontend: Next.js (Portfolio Client)
  # ============================================================================
  - type: web
    name: portfolio-pcc
    runtime: node
    rootDir: portfolio-pcc
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: portfolio-server
          property: host
        # Tự động trỏ sang https://<backend-domain>/api

  # ============================================================================
  # 3. Frontend: Admin UI (Vite React - Static Site miễn phí vĩnh viễn)
  # ============================================================================
  - type: staticSite
    name: portfolio-admin-ui
    rootDir: admin-ui
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: portfolio-server
          property: host
